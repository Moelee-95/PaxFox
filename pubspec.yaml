name: moneva
description: "Money, Finance,and everything."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.5
  sqflite_common_ffi: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.6
  image_picker: ^1.2.4
  cunning_document_scanner: ^3.0.4
  http: ^1.6.0
  cryptography: ^2.9.0
  image: ^4.12.0
  csv: ^8.0.0
  file_picker: ^13.2.0
  font_awesome_flutter: 11.0.0
  fl_chart: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
  fonts:
    - family: PaxFoxRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic
